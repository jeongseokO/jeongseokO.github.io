  {%- if page.ref == "home" -%}{%- assign nav_base = "" -%}{%- else -%}{%- assign nav_base = home_url -%}{%- endif %}
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{{ home_url | relative_url }}">{{ site.data.profile.name[page.lang] | default: site.title }}</a>
      <nav class="site-nav" aria-label="{{ t.nav_label }}">
        <a href="{{ nav_base }}#about">{{ t.nav_about }}</a>
        <a href="{{ nav_base }}#research">{{ t.nav_research }}</a>
        <a href="{{ nav_base }}#publications">{{ t.nav_publications }}</a>
      </nav>
      <div class="site-tools">
        {%- if counterpart %}
        <a class="lang-switch" href="{{ counterpart.url | relative_url }}" hreflang="{{ other_lang }}" lang="{{ other_lang }}" title="{{ t.switch_title }}">{{ t.switch_label }}</a>
        {%- endif %}
        <button type="button" class="theme-toggle" aria-label="{{ t.theme_toggle }}" title="{{ t.theme_toggle }}" hidden>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>
