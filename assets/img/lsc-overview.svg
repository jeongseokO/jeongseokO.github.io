<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Latent Self-Consistency inference pipeline</title>
<desc id="d">Three stages. 1: the frozen base LLM samples N responses to a question. 2: K learnable summary tokens are appended after each response's EOS token and, reusing the KV cache, turned into one embedding per response. 3: responses are compared by cosine similarity and the one most similar to the others is selected, while an outlier is ignored.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a93a6"/></marker></defs>
<rect width="760" height="332" rx="14" fill="#fdfcf9"/>
<circle cx="35" cy="30" r="11" fill="#3b4cca"/><text x="35" y="34.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="52" y="35" font-size="13.5" font-weight="650" fill="#1d2433">Candidate generation</text>
<circle cx="291" cy="30" r="11" fill="#3b4cca"/><text x="291" y="34.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<text x="308" y="35" font-size="13.5" font-weight="650" fill="#1d2433">Post-generation encoding</text>
<circle cx="551" cy="30" r="11" fill="#3b4cca"/><text x="551" y="34.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<text x="568" y="35" font-size="13.5" font-weight="650" fill="#1d2433">Majority selection</text>
<rect x="24" y="62" width="200" height="30" rx="15" fill="#eef0f7" stroke="#c9cfdb"/><text x="124" y="81.5" text-anchor="middle" font-size="12.5" fill="#1d2433">Question</text>
<line x1="124" y1="93" x2="124" y2="111" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="64" y="114" width="120" height="34" rx="8" fill="#1d2433"/><text x="124" y="135.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">Base LLM</text>
<line x1="124" y1="149" x2="124" y2="167" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/><text x="134" y="163" font-size="11" fill="#5b6475">sample N responses</text>
<rect x="24" y="170" width="200" height="22" rx="6" fill="#fff" stroke="#c9cfdb"/><text x="36" y="185" font-size="12" fill="#1d2433">Response 1</text>
<line x1="122" y1="181" x2="210" y2="181" stroke="#eef0f7" stroke-width="6" stroke-linecap="round"/>
<line x1="228" y1="181" x2="274" y2="181" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="24" y="200" width="200" height="22" rx="6" fill="#fff" stroke="#c9cfdb"/><text x="36" y="215" font-size="12" fill="#1d2433">Response 2</text>
<line x1="122" y1="211" x2="210" y2="211" stroke="#eef0f7" stroke-width="6" stroke-linecap="round"/>
<line x1="228" y1="211" x2="274" y2="211" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="24" y="230" width="200" height="22" rx="6" fill="#fff" stroke="#c9cfdb"/><text x="36" y="245" font-size="12" fill="#1d2433">Response 3</text>
<line x1="122" y1="241" x2="210" y2="241" stroke="#eef0f7" stroke-width="6" stroke-linecap="round"/>
<line x1="228" y1="241" x2="274" y2="241" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="24" y="276" width="200" height="22" rx="6" fill="#fff" stroke="#c9cfdb"/><text x="36" y="291" font-size="12" fill="#1d2433">Response N</text>
<line x1="122" y1="287" x2="210" y2="287" stroke="#eef0f7" stroke-width="6" stroke-linecap="round"/>
<line x1="228" y1="287" x2="274" y2="287" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="124" y="266" text-anchor="middle" font-size="14" fill="#5b6475">⋮</text>
<text x="380" y="266" text-anchor="middle" font-size="14" fill="#5b6475">⋮</text>
<text x="512" y="266" text-anchor="middle" font-size="14" fill="#5b6475">⋮</text>
<text x="280" y="76" font-size="12" fill="#5b6475">Append K learnable summary tokens</text>
<text x="280" y="92" font-size="12" fill="#5b6475">after each response's EOS token.</text>
<text x="280" y="116" font-size="12" fill="#5b6475">Reuse the KV cache, so only the K</text>
<text x="280" y="132" font-size="12" fill="#5b6475">new positions are computed → zᵢ</text>
<rect x="280" y="170" width="78" height="22" rx="6" fill="#fff" stroke="#c9cfdb"/><text x="290" y="185" font-size="11" fill="#1d2433">resp. 1</text>
<rect x="362" y="170" width="34" height="22" rx="5" fill="#eef0f7" stroke="#c9cfdb"/><text x="379" y="184.5" text-anchor="middle" font-size="9.5" fill="#5b6475">EOS</text>
<rect x="400" y="170" width="20" height="22" rx="5" fill="#3b4cca"/><text x="409" y="184.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">1</tspan></text>
<rect x="422" y="170" width="20" height="22" rx="5" fill="#3b4cca"/><text x="431" y="184.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">2</tspan></text>
<rect x="458" y="170" width="20" height="22" rx="5" fill="#3b4cca"/><text x="467" y="184.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">K</tspan></text>
<text x="449" y="185" text-anchor="middle" font-size="12" fill="#3b4cca">…</text>
<line x1="481" y1="181" x2="503" y2="181" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="512" cy="181" r="5" fill="#3b4cca"/>
<rect x="280" y="200" width="78" height="22" rx="6" fill="#fff" stroke="#c9cfdb"/><text x="290" y="215" font-size="11" fill="#1d2433">resp. 2</text>
<rect x="362" y="200" width="34" height="22" rx="5" fill="#eef0f7" stroke="#c9cfdb"/><text x="379" y="214.5" text-anchor="middle" font-size="9.5" fill="#5b6475">EOS</text>
<rect x="400" y="200" width="20" height="22" rx="5" fill="#3b4cca"/><text x="409" y="214.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">1</tspan></text>
<rect x="422" y="200" width="20" height="22" rx="5" fill="#3b4cca"/><text x="431" y="214.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">2</tspan></text>
<rect x="458" y="200" width="20" height="22" rx="5" fill="#3b4cca"/><text x="467" y="214.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">K</tspan></text>
<text x="449" y="215" text-anchor="middle" font-size="12" fill="#3b4cca">…</text>
<line x1="481" y1="211" x2="503" y2="211" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="512" cy="211" r="5" fill="#3b4cca"/>
<rect x="280" y="230" width="78" height="22" rx="6" fill="#fff" stroke="#c9cfdb"/><text x="290" y="245" font-size="11" fill="#1d2433">resp. 3</text>
<rect x="362" y="230" width="34" height="22" rx="5" fill="#eef0f7" stroke="#c9cfdb"/><text x="379" y="244.5" text-anchor="middle" font-size="9.5" fill="#5b6475">EOS</text>
<rect x="400" y="230" width="20" height="22" rx="5" fill="#3b4cca"/><text x="409" y="244.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">1</tspan></text>
<rect x="422" y="230" width="20" height="22" rx="5" fill="#3b4cca"/><text x="431" y="244.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">2</tspan></text>
<rect x="458" y="230" width="20" height="22" rx="5" fill="#3b4cca"/><text x="467" y="244.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">K</tspan></text>
<text x="449" y="245" text-anchor="middle" font-size="12" fill="#3b4cca">…</text>
<line x1="481" y1="241" x2="503" y2="241" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="512" cy="241" r="5" fill="#3b4cca"/>
<rect x="280" y="276" width="78" height="22" rx="6" fill="#fff" stroke="#c9cfdb"/><text x="290" y="291" font-size="11" fill="#1d2433">resp. N</text>
<rect x="362" y="276" width="34" height="22" rx="5" fill="#eef0f7" stroke="#c9cfdb"/><text x="379" y="290.5" text-anchor="middle" font-size="9.5" fill="#5b6475">EOS</text>
<rect x="400" y="276" width="20" height="22" rx="5" fill="#3b4cca"/><text x="409" y="290.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">1</tspan></text>
<rect x="422" y="276" width="20" height="22" rx="5" fill="#3b4cca"/><text x="431" y="290.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">2</tspan></text>
<rect x="458" y="276" width="20" height="22" rx="5" fill="#3b4cca"/><text x="467" y="290.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">S<tspan font-size="7" dy="2">K</tspan></text>
<text x="449" y="291" text-anchor="middle" font-size="12" fill="#3b4cca">…</text>
<line x1="481" y1="287" x2="503" y2="287" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="512" cy="287" r="5" fill="#3b4cca"/>
<text x="540" y="76" font-size="12" fill="#5b6475">Score each response by its cosine</text>
<text x="540" y="92" font-size="12" fill="#5b6475">similarity to the others, weighted</text>
<text x="540" y="108" font-size="12" fill="#5b6475">exponentially; return the highest.</text>
<line x1="520" y1="236" x2="537" y2="236" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="540" y="150" width="196" height="150" rx="10" fill="#f4f5fa" stroke="#dfe3ec"/>
<text x="552" y="168" font-size="10.5" fill="#5b6475">embedding space</text>
<line x1="590" y1="198" x2="613" y2="214" stroke="#3b4cca" stroke-opacity="0.45" stroke-dasharray="3 3"/>
<line x1="613" y1="214" x2="596" y2="230" stroke="#3b4cca" stroke-opacity="0.45" stroke-dasharray="3 3"/>
<line x1="590" y1="198" x2="596" y2="230" stroke="#3b4cca" stroke-opacity="0.45" stroke-dasharray="3 3"/>
<circle cx="590" cy="198" r="6" fill="#3b4cca"/>
<circle cx="613" cy="214" r="6" fill="#3b4cca"/>
<circle cx="596" cy="230" r="6" fill="#3b4cca"/>
<circle cx="700" cy="272" r="6" fill="#3b4cca" fill-opacity="0.45"/>
<circle cx="613" cy="214" r="11.5" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="630" y="205" font-size="11.5" font-weight="650" fill="#c2410c">selected</text>
<text x="700" y="292" text-anchor="middle" font-size="10.5" fill="#5b6475">outlier</text>
<rect x="24" y="309" width="13" height="13" rx="3" fill="#1d2433"/><text x="43" y="319.5" font-size="11" fill="#5b6475">frozen base LLM</text>
<rect x="280" y="309" width="13" height="13" rx="3" fill="#3b4cca"/><text x="299" y="319.5" font-size="11" fill="#5b6475">summary-token embeddings (the only trained parameters)</text>
</svg>
