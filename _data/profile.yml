research_goal:
  en: "The goal behind most of my work is a language model people can rely on. I don't think one technique gets us there. The model has to be cheap enough to check, its answers have to survive the check, and we need a way to tell it what we actually want. Each of the three areas below takes on one of these."
  ko: "제 연구가 결국 향하는 곳은 사람들이 믿고 쓸 수 있는 언어 모델입니다. 한 가지 기법만으로 되는 일은 아니라고 생각합니다. 검증할 수 있을 만큼 모델이 가벼워야 하고, 검증해도 답이 흔들리지 않아야 하고, 우리가 원하는 바를 모델에게 제대로 전할 수도 있어야 합니다. 아래 세 분야가 이 조건을 하나씩 다룹니다."

goal:
  title: Trustworthy AI
  summary:
    en: Language models people can rely on
    ko: 믿고 쓸 수 있는 언어 모델

# The three research directions. `id` also names the illustration in _includes/illus/.
# `keywords` is the short line shown under each name in the overview diagram.
pillars:
  - id: architecture
    title:
      en: LLM Architecture
      ko: LLM Architecture
    keywords: Linear attention · Pruning
    summary:
      en: "Two things make LLMs expensive to run: attention, whose cost grows quadratically with the length of the input, and the sheer size of the model. I'm interested in linear and hybrid attention for the first, and in structured pruning, which removes whole layers or attention heads, for the second. A cheaper model also means we can afford to ask it the same question several times and compare the answers. My preprint SPEED works on the KV cache: it keeps long prompts in the lower layers only."
      ko: "LLM을 돌리는 데 비용이 많이 드는 이유는 크게 두 가지입니다. 입력이 길어질수록 연산량이 제곱으로 늘어나는 attention, 그리고 모델 자체의 크기입니다. 앞의 문제와 관련해서는 linear·hybrid attention에, 뒤의 문제와 관련해서는 층이나 attention head를 통째로 덜어내는 structured pruning에 관심이 있습니다. 모델이 가벼워지면 같은 질문을 여러 번 던져 답을 비교하는 일도 부담 없이 할 수 있습니다. 프리프린트인 SPEED는 KV cache 쪽에서, 긴 프롬프트를 하위층에만 남기는 방법을 다룹니다."
    project_ref: speed
    more:
      en: Read about SPEED
      ko: SPEED 자세히 보기
    topics:
      en: [Linear & hybrid attention, Structured pruning (depth / width)]
      ko: [선형·하이브리드 어텐션 (Linear & hybrid attention), 구조적 프루닝 (Structured pruning)]
    illus_title:
      en: "A Transformer layer stack with two pruned layers, and causal softmax attention (quadratic) next to linear attention (one shared state)"
      ko: "두 층이 제거된 Transformer 층 구조, 그리고 이차 비용의 causal softmax attention과 상태 하나를 공유하는 linear attention 비교"
  - id: reliability
    title:
      en: Reliability
      ko: Reliability
    keywords: Consistency · Hallucination
    summary:
      en: "Ask an LLM the same question a few times and the answers often differ. I study how to put that disagreement to use. Self-consistency keeps the answer most samples agree on, and the same signal can flag hallucinations, where the model states things that are not grounded in fact. In Latent Self-Consistency, the model compares its answers through its own hidden representations instead of matching strings."
      ko: "같은 질문을 LLM에 몇 번 던지면 답이 자주 달라집니다. 저는 이 불일치를 쓸모 있게 만드는 방법을 연구합니다. Self-consistency는 여러 답 가운데 가장 많이 겹치는 답을 고르고, 같은 신호로 모델이 사실과 다른 내용을 지어내는 환각(hallucination)도 잡아낼 수 있습니다. Latent Self-Consistency에서는 답을 문자열로 맞춰 보는 대신 모델의 내부 표현으로 비교합니다."
    topics:
      en: [Self-consistency, Hallucination mitigation]
      ko: [자기 일관성 (Self-consistency), 환각 완화 (Hallucination mitigation)]
    project_ref: lsc
    more:
      en: Read about Latent Self-Consistency
      ko: Latent Self-Consistency 자세히 보기
    illus_title:
      en: "Five sampled responses: four agree on answer A and become the selected answer, one outlier answers B"
      ko: "샘플링한 응답 다섯 개 가운데 네 개가 답 A에 합의해 선택되고, 하나는 B로 답한 동떨어진 응답"
  - id: prompting
    title:
      en: Prompt Engineering
      ko: Prompt Engineering
    keywords: CoT · In-context learning
    summary:
      en: "A lot can change without touching the weights. How the prompt is worded, whether the model is asked to reason step by step, and which examples it sees can all change what comes out. I'm interested in prompting because it is the cheapest way to get a model to do what we mean. In the MFDS translation project, we compared prompt templates and built a post-editing loop that catches broken outputs."
      ko: "가중치를 건드리지 않고도 바뀌는 게 많습니다. 프롬프트를 어떻게 쓰는지, 단계별로 생각하게 하는지, 어떤 예시를 보여 주는지에 따라 결과가 달라집니다. 모델을 원하는 방향으로 움직이는 가장 값싼 방법이라서 프롬프트에 관심을 두고 있습니다. 식약처 번역 과제에서 저희 팀은 프롬프트 템플릿을 비교하고, 잘못된 출력을 잡아내는 후편집 루프를 만들었습니다."
    project_ref: translation
    more:
      en: Read about inference strategies for translation
      ko: 번역 추론 전략 자세히 보기
    topics:
      en: [Chain-of-thought prompting, In-context learning]
      ko: [사고 사슬 프롬프팅 (Chain-of-thought), 인컨텍스트 러닝 (In-context learning)]
    illus_title:
      en: "A prompt with a highlighted instruction goes into the LLM, which then follows the intended path among several possible outputs"
      ko: "강조된 지시가 담긴 프롬프트가 LLM에 들어가고, 여러 가능한 출력 가운데 의도한 경로를 따르는 모습"
