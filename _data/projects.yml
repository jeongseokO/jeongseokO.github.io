    en: 'PI: Prof. Howard Lee (<a href="https://ccadd.snu.ac.kr/">CCADD</a>, SNU) · Co-PI: Prof. Jay-Yoon Lee (<a href="https://www.skiml.snu.ac.kr/">SKI-ML Lab</a>)'
    ko: '연구책임자 이형기 교수 (서울대 <a href="https://ccadd.snu.ac.kr/">CCADD</a>) · 공동연구책임자 이재윤 교수 (<a href="https://www.skiml.snu.ac.kr/">SKI-ML 연구실</a>)'
  summary:
    en: "MFDS needs review reports, guidelines, and regulations in English for joint reviews with foreign regulators, and this had depended on human translators. SKI-ML Lab's part was the translation model itself: we compared candidate models, fine-tuned VaivGem-9B, and worked out how to prompt it and catch its errors at inference time. The final model is now hosted on a server inside MFDS."
    ko: "식약처는 해외 규제기관과의 공동심사 등을 위해 허가심사보고서, 가이드라인, 법령을 영어로 옮겨야 하는데, 지금까지는 번역사에 의존해 왔습니다. SKI-ML 연구실은 번역 모델 자체를 맡았습니다. 여러 후보 모델을 비교해 VaivGem-9B를 미세조정했고, 추론할 때 프롬프트를 어떻게 줄지와 오류를 어떻게 잡을지를 정했습니다. 최종 모델은 식약처 내부 서버에 탑재했습니다."
  page_ref: translation
